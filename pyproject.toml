[project]
name = "nca-morphogenesis"
version = "0.1.0"
description = "Planarya benzeri organizma büyüten, onaran ve parçadan yenilenen Neural Cellular Automata"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.7",
    "numpy",
    "pillow",
    "pyyaml",
    "scikit-image",
    "scikit-learn",
    "matplotlib",
    "imageio",
    "tqdm",
    "pandas>=3.0.6",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools.packages.find]
include = ["nca*"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
