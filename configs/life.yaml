# Ön eğitim: şekilsiz "en basit canlı" (nca/train_life.py). Hedef görüntü yok.
name: life
seed: 0
grid: 64
model:
  n_hidden: 12
  n_genome: 32
  hidden_dim: 128
  perception: sobel_lap
  fire_rate: 0.5
physics:                 # LifePhysics (nca/life.py); gerisi varsayılan
  torus: true            # sarmal arena: duvar yok (64'lük kutuda canlılar duvara yapışıp parçalanıyordu)
pool_size: 1024
batch_size: 8
steps: [64, 96]
homeo_k: 16
lr: 2.0e-3
lr_drop_iter: 3000      # 6000'de 4000 civarı ıraksadı (life_s0 ilk koşu)
lr_drop: 0.1
iterations: 10000
checkpoint_segment: 16
A_min: 40
A_max: 400
e_min: 0.2
min_viable: 10
weights: {}              # kayıp ağırlıkları (varsayılan 1): mass, debris, energy, homeo, bounds
damage:
  start_iter: 1000
  n_damaged: 2
  circle_r: [0.1, 0.3]
  keep_frac: [0.3, 0.8]
log_every: 50
print_every: 500
snapshot_every: 1000
out_dir: runs
