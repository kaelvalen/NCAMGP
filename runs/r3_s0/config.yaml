  regime: R3
  n_damaged: 3
  start_iter: 0
  circle_r:
  - 0.1
  - 0.4
  keep_frac:
  - 0.2
  - 0.8
  r3_circle_prob: 0.5
log_every: 50
snapshot_every: 1000
out_dir: runs
