name: r3
seed: 0
target: targets/planaria.npz
grid: 72
model:
  n_hidden: 12
  hidden_dim: 128
  perception: sobel_lap
  fire_rate: 0.5
pool:
  enabled: true
  size: 1024
batch_size: 8
steps:
- 64
- 96
